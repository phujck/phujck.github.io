<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="theme-color" content="#0a0e1a">
<title>Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <style id="identity-tokens">:root{--bg-primary:#0a0e1a;--bg-secondary:#111827;--bg-card:rgba(255, 255, 255, 0.04);--bg-card-hover:rgba(255, 255, 255, 0.07);--bg-glass:rgba(255, 255, 255, 0.06);--border-glass:rgba(255, 255, 255, 0.08);--text-primary:#e8e6e3;--text-secondary:#9ca3af;--text-muted:#6b7280;--accent:#c9a96e;--accent-light:#dfc599;--accent-dim:rgba(201, 169, 110, 0.15);--accent-warm-1:#e6cc92;--accent-warm-2:#b8894a;--accent-warm-3:#8a6330;--link:#7eb8da;--link-hover:#a8d4f0;--refused:#c0392b;--refused-dim:rgba(192, 57, 43, 0.12);--evidence:#a89a7a;}</style>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg-primary)}
body{font-family:'Lora',Georgia,serif;background:var(--bg-primary);color:var(--text-primary);
  font-size:16.5px;line-height:1.66;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(1100px 500px at 70% -10%, rgba(201,169,110,.055), transparent 60%)}
a{color:var(--link)}a:hover{color:var(--link-hover)}
.wrap{max-width:72ch;margin:0 auto;padding:3.4rem 1.25rem 5.5rem}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:.68rem;letter-spacing:.16em;
  text-transform:uppercase;color:var(--evidence);margin-bottom:1.1rem}
h1{font-family:'Outfit',sans-serif;font-weight:700;font-size:2.15rem;line-height:1.12;
  letter-spacing:-.015em;margin-bottom:.5rem}
.sub{color:var(--text-secondary);font-style:italic;margin-bottom:1.6rem;font-size:1.02rem}
.provenance{font-size:.84rem;color:var(--text-secondary);border:1px solid var(--border-glass);
  border-left:2px solid var(--accent);border-radius:6px;padding:.7rem .95rem;margin-bottom:2.4rem;
  background:var(--bg-glass)}
h2{font-family:'Outfit',sans-serif;font-weight:600;font-size:1.3rem;letter-spacing:-.01em;
  margin:3rem 0 .95rem;padding-bottom:.4rem;border-bottom:1px solid var(--border-glass)}
p{margin:.75rem 0}
strong{font-weight:600;color:var(--text-primary)}
em{color:var(--text-primary)}
.evidence,code{font-family:'JetBrains Mono',monospace;font-weight:400;font-size:.86em;
  color:var(--evidence)}
.board{list-style:none;margin:1.1rem 0}
.board li{display:flex;gap:.75rem;align-items:baseline;padding:.5rem 0;
  border-bottom:1px dotted var(--border-glass)}
.chip{font-family:'JetBrains Mono',monospace;font-size:.6rem;font-weight:500;letter-spacing:.12em;
  text-transform:uppercase;padding:.18rem .5rem;border-radius:3px;flex:0 0 auto;min-width:6.4rem;
  text-align:center;border:1px solid var(--border-glass);color:var(--bg-primary)}
.c-run{background:var(--accent)}
.c-ver{background:var(--link)}
.c-proto{background:var(--accent-warm-2);color:var(--bg-primary)}
.c-open{background:var(--text-muted)}
.cap{font-size:.9rem;color:var(--text-secondary);margin:1rem 0 .4rem}
.figobj{margin:.3rem 0 .5rem;background:var(--bg-secondary);border:1px solid var(--border-glass);
  border-radius:6px;padding:14px;box-shadow:0 18px 44px -22px rgba(0,0,0,.75)}
.figobj svg{display:block;width:100%;height:auto}
details{margin:.25rem 0 1.6rem}
details summary{font-family:'JetBrains Mono',monospace;font-size:.74rem;color:var(--link);
  cursor:pointer;letter-spacing:.02em}
details[open] summary{color:var(--link-hover)}
details>.figbox{margin:.6rem 0 .2rem;border:1px solid var(--border-glass);border-radius:6px;
  background:var(--bg-secondary);overflow-x:auto;padding:10px;
  animation:reveal 170ms cubic-bezier(.16,1,.3,1)}
@keyframes reveal{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.figbox svg{display:block;min-width:640px;width:100%;height:auto}
.overlay-note{border:1px solid var(--border-glass);border-left:2px solid var(--link);
  border-radius:6px;background:var(--bg-glass);padding:.8rem 1rem;margin:1.1rem 0;
  font-size:.95rem}
.foot{margin-top:4rem;padding-top:1.1rem;border-top:1px solid var(--border-glass);
  font-size:.85rem;color:var(--text-secondary)}
/* ---- the lock ---- */
#lock{position:fixed;inset:0;z-index:100;background:var(--bg-primary);display:flex;
  align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:24px}
#lock h1{font-size:1.25rem;margin:0}
#lock .lsub{color:var(--text-muted);font-size:.78rem;font-family:'JetBrains Mono',monospace;
  text-align:center;max-width:34rem;line-height:1.6}
#lock form{display:flex;flex-direction:column;gap:10px;width:min(340px,88vw)}
#lock input[type=password]{background:var(--bg-secondary);border:1px solid var(--border-glass);
  color:var(--text-primary);padding:12px 14px;border-radius:8px;font:inherit}
#lock input:focus{outline:none;border-color:var(--accent)}
#lock button{background:var(--accent);border:0;color:var(--bg-primary);padding:12px;
  border-radius:8px;font-family:'Outfit',sans-serif;font-weight:600;font-size:.95rem;cursor:pointer}
#lock button.quiet{background:transparent;border:1px solid var(--border-glass);
  color:var(--text-secondary);font-weight:400;font-size:.8rem}
#lock label{display:flex;gap:7px;align-items:center;color:var(--text-secondary);font-size:.82rem}
#lock .msg{color:var(--text-muted);font-size:.75rem;min-height:16px;
  font-family:'JetBrains Mono',monospace}
#lock .msg.bad{color:var(--refused)}
.hidden{display:none!important}
@media (max-width:640px){.wrap{padding:2.2rem 1rem 4rem}h1{font-size:1.7rem}}
</style>
</head>
<body>
<div id="lock">
  <div style="font-size:28px;color:var(--accent)">◈</div>
  <h1>Register</h1>
  <div class="lsub">nothing decrypts on the server — the bytes are scrambled under your passphrase</div>
  <form id="lf">
    <input type="password" id="pw" placeholder="passphrase" autocomplete="current-password" autofocus>
    <label><input type="checkbox" id="rem" checked> remember on this device</label>
    <button type="submit">unlock</button>
    <button type="button" class="quiet" id="forget">forget passphrase on this device</button>
    <div class="msg" id="msg"></div>
  </form>
  <noscript><div class="lsub">this page decrypts in the browser and needs JavaScript</div></noscript>
</div>
<div id="doc" class="hidden"></div>
<script>
(function(){
const MAGIC=[76,82,69,86,49,0],ITER=200000,IDB="laplace-registers",KEY="key-"+location.pathname;
const $=id=>document.getElementById(id);
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open(IDB,1);
  r.onupgradeneeded=()=>r.result.createObjectStore("kv");
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbSet(k,v){const db=await idb();return new Promise((res,rej)=>{
  const t=db.transaction("kv","readwrite");t.objectStore("kv").put(v,k);
  t.oncomplete=res;t.onerror=()=>rej(t.error);});}
async function idbGet(k){const db=await idb();return new Promise(res=>{
  const t=db.transaction("kv");const r=t.objectStore("kv").get(k);
  r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);});}
async function idbDel(k){const db=await idb();return new Promise(res=>{
  const t=db.transaction("kv","readwrite");t.objectStore("kv").delete(k);
  t.oncomplete=res;t.onerror=res;});}
let BLOB=null;
async function blob(){if(BLOB)return BLOB;
  const r=await fetch("data.enc",{cache:"no-store"});
  if(!r.ok)throw new Error("data.enc "+r.status);
  BLOB=new Uint8Array(await r.arrayBuffer());
  for(let i=0;i<MAGIC.length;i++)if(BLOB[i]!==MAGIC[i])throw new Error("not a register bundle");
  return BLOB;}
async function deriveKey(pw,salt){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:ITER,hash:"SHA-256"},km,
    {name:"AES-GCM",length:256},false,["decrypt"]);}
async function open_(key){const b=await blob();const body=b.subarray(MAGIC.length);
  const iv=body.subarray(16,28),ct=body.subarray(28);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct);
  $("doc").innerHTML=new TextDecoder().decode(pt);
  $("lock").remove();$("doc").classList.remove("hidden");}
$("lf").addEventListener("submit",async e=>{e.preventDefault();
  $("msg").textContent="deriving…";$("msg").className="msg";
  try{const b=await blob();const salt=b.subarray(MAGIC.length,MAGIC.length+16);
    const key=await deriveKey($("pw").value,salt);
    await open_(key);
    if($("rem").checked){try{await idbSet(KEY,key);}catch(_){}}
  }catch(err){$("msg").textContent="that passphrase does not unlock this page";
    $("msg").className="msg bad";}});
$("forget").addEventListener("click",async()=>{await idbDel(KEY);
  $("msg").textContent="forgotten on this device";$("msg").className="msg";});
(async()=>{try{const k=await idbGet(KEY);if(k)await open_(k);}catch(_){}})();
})();
</script>
</body>
</html>
