<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430">
<title>Where Eigen runs</title>
<text x="40" y="34" font-family="Outfit,sans-serif" font-size="17" fill="#e8e6e3" font-weight="600">Where Eigen runs</text>
<rect x="40" y="60" width="540" height="290" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(201, 169, 110, 0.15)" stroke-width="1.5" rx="12"/>
<text x="60" y="88" font-family="Outfit,sans-serif" font-size="13.5" fill="#dfc599" font-weight="600">your environment: everything inside stays yours</text>
<rect x="70" y="110" width="210" height="110" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" rx="8"/>
<text x="88" y="138" font-family="Lora,Georgia,serif" font-size="12.5" fill="#e8e6e3">your repositories,</text>
<text x="88" y="156" font-family="Lora,Georgia,serif" font-size="12.5" fill="#e8e6e3">records and history</text>
<text x="88" y="182" font-family="Lora,Georgia,serif" font-size="11.5" fill="#9ca3af">read in full once, then</text>
<text x="88" y="198" font-family="Lora,Georgia,serif" font-size="11.5" fill="#9ca3af">kept current incrementally</text>
<rect x="330" y="110" width="210" height="110" fill="rgba(255, 255, 255, 0.06)" stroke="#c9a96e" stroke-width="1.5" rx="8"/>
<text x="348" y="138" font-family="Outfit,sans-serif" font-size="13" fill="#dfc599" font-weight="600">Eigen</text>
<text x="348" y="162" font-family="Lora,Georgia,serif" font-size="11.5" fill="#9ca3af">keeps the working structure</text>
<text x="348" y="178" font-family="Lora,Georgia,serif" font-size="11.5" fill="#9ca3af">that survives between sessions,</text>
<text x="348" y="194" font-family="Lora,Georgia,serif" font-size="11.5" fill="#9ca3af">so each day starts from little</text>
<line x1="280" y1="165" x2="330" y2="165" stroke="#c9a96e" stroke-width="1.5"/>
<path d="M 330 165 l -7 -4 v 8 z" fill="#c9a96e"/>
<rect x="70" y="250" width="470" height="76" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" rx="8"/>
<text x="88" y="276" font-family="Lora,Georgia,serif" font-size="12" fill="#9ca3af">stays on your machine: your documents, the index built over them,</text>
<text x="88" y="294" font-family="Lora,Georgia,serif" font-size="12" fill="#9ca3af">and the record; Eigen stores nothing outside it</text>
<text x="88" y="312" font-family="Lora,Georgia,serif" font-size="12" fill="#9ca3af"></text>
<rect x="660" y="110" width="180" height="110" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" rx="8"/>
<text x="678" y="138" font-family="Outfit,sans-serif" font-size="12.5" fill="#e8e6e3" font-weight="600">model provider</text>
<text x="678" y="162" font-family="Lora,Georgia,serif" font-size="11.5" fill="#9ca3af">any of them; nothing</text>
<text x="678" y="178" font-family="Lora,Georgia,serif" font-size="11.5" fill="#9ca3af">here needs a provider's</text>
<text x="678" y="194" font-family="Lora,Georgia,serif" font-size="11.5" fill="#9ca3af">permission or plug-in</text>
<line x1="540" y1="165" x2="660" y2="165" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
<path d="M 660 165 l -7 -4 v 8 z" fill="#6b7280"/>
<text x="600" y="150" font-family="Lora,Georgia,serif" font-size="10.5" fill="#6b7280" text-anchor="middle">goes out: the text of each request,</text>
<text x="600" y="205" font-family="Lora,Georgia,serif" font-size="10.5" fill="#6b7280" text-anchor="middle">to your own model provider, fewer of them</text>
<text x="40" y="384" font-family="Lora,Georgia,serif" font-size="11.5" fill="#6b7280">a sketch; nothing in it is measured</text>
<text x="12" y="420" font-family="JetBrains Mono,monospace" font-size="9.5" fill="#a89a7a" opacity="0.85">source: the deployment shape as designed, 30 July 2026</text>
</svg>