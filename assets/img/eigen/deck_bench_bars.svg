<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300">
<title>Three ways to start the same day&#x27;s work on one repository</title>
<text x="40" y="34" font-family="Outfit,sans-serif" font-size="17" fill="#e8e6e3" font-weight="600">Three ways to start the same day's work on one repository</text>
<text x="40" y="56" font-family="Lora,Georgia,serif" font-size="12" fill="#9ca3af">tokens read before work can begin; one scored run on Eigen's own repository, 28 July 2026; twelve orientation questions</text>
<text x="288" y="111" font-family="Lora,Georgia,serif" font-size="13" fill="#e8e6e3" text-anchor="end">Eigen, starting from its record</text>
<rect x="290" y="96" width="21" height="22" fill="#c9a96e" rx="3" opacity="1.0"/>
<text x="323" y="111" font-family="JetBrains Mono,monospace" font-size="11.5" fill="#a89a7a">8,408 tokens · answered 12 of 12</text>
<text x="288" y="167" font-family="Lora,Georgia,serif" font-size="13" fill="#e8e6e3" text-anchor="end">the repository's guide files, read whole</text>
<rect x="290" y="152" width="230" height="22" fill="#6b7280" rx="3" opacity="0.55"/>
<text x="532" y="167" font-family="JetBrains Mono,monospace" font-size="11.5" fill="#a89a7a">93,181 tokens · answered 9 of 12</text>
<text x="288" y="223" font-family="Lora,Georgia,serif" font-size="13" fill="#e8e6e3" text-anchor="end">the guide files plus two more</text>
<rect x="290" y="208" width="400" height="22" fill="#6b7280" rx="3" opacity="0.55"/>
<text x="702" y="223" font-family="JetBrains Mono,monospace" font-size="11.5" fill="#a89a7a">161,950 tokens · answered 12 of 12</text>
<text x="40" y="274" font-family="Lora,Georgia,serif" font-size="11.5" fill="#6b7280">reading the files whole was cheaper only because it answered fewer of the twelve questions</text>
<text x="12" y="290" font-family="JetBrains Mono,monospace" font-size="9.5" fill="#a89a7a" opacity="0.85">source: the 2026-07-28 benchmark run, recomputed from its rows</text>
</svg>