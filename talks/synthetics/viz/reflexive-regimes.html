<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>reflexive-regimes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Lora:wght@400;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
  /* Synthetics deck applet: reflexive-regimes. Palette and rules: talks/synthetics/STYLE.md */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0e1a; color: #e8e6e3;
    font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  #stage { position: fixed; inset: 0; display: flex; flex-direction: column; }
  #frame { position: relative; flex: 1 1 auto; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<div id="stage">
  <div id="frame"><canvas id="cv"></canvas></div>
</div>
<script>
"use strict";
/* ---------- palette (STYLE.md) ---------- */
const C = { ground: "#0a0e1a", ink: "#e8e6e3", muted: "#9ca3af", gold: "#c9a96e", blue: "#7eb8da",
            green: "#5cbf9a", orange: "#e0875a", rule: "rgba(255,255,255,0.08)", card: "rgba(255,255,255,0.04)" };
const FONT = { sans: "Inter, system-ui, sans-serif", serif: "Lora, Georgia, serif", mono: '"JetBrains Mono", monospace' };

/* ---------- determinism: seeded PRNG, no Math.random, no wall clock ---------- */
function mulberry32(seed) { let a = seed >>> 0; return function () {
  a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const SEED = 20261021;
const rand = mulberry32(SEED);

/* ---------- clock: ?t=<seconds> starts there, ?pause=1 freezes, reduced motion settles ---------- */
const Q = new URLSearchParams(location.search);
let clock = Number(Q.get("t") || 0);
let paused = Q.get("pause") === "1";
let reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const SETTLE_AT = 11;
if (reduced) clock = SETTLE_AT;

/* ---------- geometry: the paper's figure (02_distinctions.tex, fig:coarse-graining), units of its tikz, Omega radius 1.7 ---------- */
const OMEGA = 1.7;
// configurations of Omega: one seeded scatter, shared by the three panels
const PTS = []; while (PTS.length < 90) { const x = (2 * rand() - 1) * OMEGA, y = (2 * rand() - 1) * OMEGA; if (x * x + y * y < (OMEGA - 0.12) ** 2) PTS.push([x, y]); }
const inE = (p, e) => ((p[0] - e.cx) / e.rx) ** 2 + ((p[1] - e.cy) / e.ry) ** 2 <= 1;
const lerp = (a, b, u) => a + (b - a) * u;
const clamp01 = u => Math.max(0, Math.min(1, u));
const ease = u => { u = clamp01(u); return u * u * (3 - 2 * u); };
// register cells (panel c): a lattice of pitch G inside the register; the self-image is that lattice under the
// symbol map: BLOCK x BLOCK register cells merge into one class, drawn at scale SELF inside the register
const G = 0.16, BLOCK = 3, SELF = 0.55;
const REG_C = { cx: 0.1, cy: -0.1, rx: 0.6, ry: 0.8 };
const CELLS = (function () {
  const reg = [], blocks = new Map();
  for (let i = -8; i <= 8; i++) for (let j = -8; j <= 8; j++) {
    const c = [REG_C.cx + (i + 0.5) * G, REG_C.cy + (j + 0.5) * G];
    if (!inE(c, REG_C)) continue;
    reg.push([i, j]);
    const bi = Math.floor((i + 0.5 * BLOCK) / BLOCK), bj = Math.floor((j + 0.5 * BLOCK) / BLOCK);
    blocks.set(bi + "," + bj, [bi, bj]);
  }
  return { reg, self: [...blocks.values()] };
})();

/* ---------- canvas with device-pixel scaling ---------- */
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1;
function resize() {
  const r = cv.getBoundingClientRect(); DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(1, Math.round(r.width)); H = Math.max(1, Math.round(r.height));
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", () => { resize(); draw(clock); });
function text(t, x, y, col, size, align, weight, font) { ctx.fillStyle = col; ctx.font = `${weight || 400} ${size}px ${font || FONT.sans}`; ctx.textAlign = align || "center"; ctx.fillText(t, x, y); }

/* ---------- the applet ---------- */
function draw(t) {
  ctx.fillStyle = C.ground; ctx.fillRect(0, 0, W, H);
  const pad = 16, colW = (W - 2 * pad) / 3;
  const R = Math.max(40, Math.min(colW * 0.4, (H - 34 - 26 - 24 - 24 - 44 - pad) / 2));
  const S = R / OMEGA, cyPx = 34 + R;
  // timeline: (b) the register slides into the target; (c) the target grows to all of Omega; then the self-image
  const ub = ease((t - 0.8) / 3.2), uc = ease((t - 4.4) / 2.8), ucell = clamp01((t - 7.4) / 1.0), uself = clamp01((t - 8.6) / 1.2);
  const panels = [
    { name: "(a) disjoint", T: { cx: -0.5, cy: 0.1, rx: 0.7, ry: 0.9 }, Rg: { cx: 0.78, cy: -0.2, rx: 0.55, ry: 0.8 } },   // paper: (0.6,-0.2) 0.6x0.8, which grazes the target; nudged so the two share no configuration
    { name: "(b) coupled", T: { cx: -0.2, cy: 0.1, rx: 0.9, ry: 1.0 }, Rg: { cx: lerp(0.95, 0.4, ub), cy: 0.0, rx: 0.7, ry: 0.9 } },
    { name: "(c) reflexive", T: { cx: lerp(-0.8, 0, uc), cy: lerp(0.4, 0, uc), rx: lerp(0.55, OMEGA, uc), ry: lerp(0.7, OMEGA, uc) }, Rg: REG_C },
  ];
  panels.forEach((P, k) => {
    const cx = pad + colW * (k + 0.5);
    const X = x => cx + x * S, Y = y => cyPx - y * S;
    const ell = (e) => { ctx.beginPath(); ctx.ellipse(X(e.cx), Y(e.cy), e.rx * S, e.ry * S, 0, 0, 2 * Math.PI); };
    // Omega
    ctx.fillStyle = C.card; ctx.beginPath(); ctx.arc(cx, cyPx, R, 0, 2 * Math.PI); ctx.fill();
    ctx.save(); ctx.beginPath(); ctx.arc(cx, cyPx, R, 0, 2 * Math.PI); ctx.clip();
    // target (solid blue)
    ell(P.T); ctx.fillStyle = "rgba(126,184,218,0.16)"; ctx.fill(); ctx.strokeStyle = C.blue; ctx.lineWidth = 1.8; ctx.stroke();
    ctx.restore();
    ctx.strokeStyle = C.muted; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.arc(cx, cyPx, R, 0, 2 * Math.PI); ctx.stroke();
    text("Ω", cx - R * 0.78, cyPx - R * 0.72, C.muted, 18, "center", 600);
    // register (dashed orange)
    ell(P.Rg); ctx.fillStyle = "rgba(224,135,90,0.14)"; ctx.fill();
    ctx.setLineDash([7, 5]); ctx.strokeStyle = C.orange; ctx.lineWidth = 1.8; ctx.stroke(); ctx.setLineDash([]);
    // configurations
    const pointAlpha = k === 2 ? 1 - ucell : 1;
    for (const p of PTS) {
      const iT = k === 2 && uc >= 1 ? true : inE(p, P.T), iR = inE(p, P.Rg);
      let col = C.muted, r = 2.2, a = 0.45;
      if (iR && iT && k < 2) { col = C.green; r = 3.6; a = 1; }
      else if (iR) { col = C.orange; r = 3; a = pointAlpha; }
      else if (iT) { col = C.blue; r = 3; a = 1; }
      ctx.globalAlpha = a; ctx.fillStyle = col; ctx.beginPath(); ctx.arc(X(p[0]), Y(p[1]), r, 0, 2 * Math.PI); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // labels
    if (k < 2) text("target", X(P.T.cx), Y(P.T.cy + P.T.ry) - 8, C.blue, 15);
    else text(uc >= 1 ? "target = Ω" : "target", uc >= 1 ? cx : X(P.T.cx), uc >= 1 ? cyPx - R - 10 : Y(P.T.cy + P.T.ry) - 8, C.blue, 15);
    text("register", X(P.Rg.cx), Y(P.Rg.cy - P.Rg.ry) + 20, C.orange, 15);
    // panel (c): the register's cells and its coarser self-image
    if (k === 2 && ucell > 0) {
      const g = G * S;
      ctx.save(); ell(P.Rg); ctx.clip();
      ctx.globalAlpha = ucell; ctx.strokeStyle = C.orange; ctx.lineWidth = 1;
      for (const [i, j] of CELLS.reg) ctx.strokeRect(X(REG_C.cx + i * G) + 1, Y(REG_C.cy + (j + 1) * G) + 1, g - 2, g - 2);
      ctx.restore(); ctx.globalAlpha = 1;
      if (uself > 0) {
        const se = { cx: REG_C.cx, cy: REG_C.cy, rx: REG_C.rx * SELF, ry: REG_C.ry * SELF }, bg = BLOCK * G * SELF;
        ctx.globalAlpha = uself;
        ell(se); ctx.fillStyle = C.ground; ctx.fill(); ctx.fillStyle = "rgba(232,230,227,0.12)"; ctx.fill();
        ctx.save(); ell(se); ctx.clip(); ctx.strokeStyle = C.ink; ctx.lineWidth = 1.6;
        for (const [bi, bj] of CELLS.self) {
          const x0 = REG_C.cx + (bi * BLOCK - 0.5 * BLOCK) * G * SELF, y1 = REG_C.cy + (bj * BLOCK + 0.5 * BLOCK) * G * SELF;
          ctx.strokeRect(X(x0), Y(y1), bg * S, bg * S);
        }
        ctx.restore();
        ell(se); ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }
    // below the circle
    let yb = cyPx + R + 26;
    if (k === 2) {
      ctx.globalAlpha = uself;
      ctx.font = `400 15px ${FONT.mono}`;
      const a = `register ${CELLS.reg.length} cells`, b = `self-image ${CELLS.self.length} cells`, sep = "  ·  ";
      const wa = ctx.measureText(a).width, ws = ctx.measureText(sep).width, wb = ctx.measureText(b).width;
      const x0 = Math.max(pad, Math.min(cx - (wa + ws + wb) / 2, W - pad - (wa + ws + wb)));   // clamp inside the canvas at any width
      text(a, x0, yb, C.orange, 15, "left", 400, FONT.mono); text(sep, x0 + wa, yb, C.muted, 15, "left", 400, FONT.mono);
      text(b, x0 + wa + ws, yb, C.ink, 15, "left", 400, FONT.mono);
      ctx.globalAlpha = 1;
    }
    yb += 26;
    text(P.name, cx, yb, C.ink, 17, "center", 600);
    if (k === 2) {
      const ex = "quantum mechanics · machine learning · neuroscience";
      ctx.font = `400 15px ${FONT.sans}`;
      const we = ctx.measureText(ex).width;
      const exx = Math.max(pad + we / 2, Math.min(cx, W - pad - we / 2));   // keep the examples line inside the canvas
      text(ex, exx, yb + 24, C.muted, 15);
    }
  });
  // the paper's bottom arrow
  const ay = H - pad - 22, ax0 = pad + colW * 0.2, ax1 = W - pad - colW * 0.2;
  ctx.strokeStyle = C.muted; ctx.fillStyle = C.muted; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(ax0, ay); ctx.lineTo(ax1 - 10, ay); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ax1, ay); ctx.lineTo(ax1 - 12, ay - 6); ctx.lineTo(ax1 - 12, ay + 6); ctx.closePath(); ctx.fill();
  text("increasing self-reference", (ax0 + ax1) / 2, ay + 20, C.muted, 15);
}
function settled(t) { return t >= SETTLE_AT; }

/* ---------- loop ---------- */
let last = null;
/* deck play control: the deck's button (Embed.vue) fires "deckplay" in this window; the applet then runs from the start of
   its current stage even when the visitor's browser asks for reduced motion, because the visitor asked for it */
const _raf = window.requestAnimationFrame.bind(window); let frameAlive = false;
function raf(fn) { frameAlive = true; return _raf(ts => { frameAlive = false; fn(ts); }); }
window.addEventListener("deckplay", () => {
  reduced = false; paused = false; last = null;
  clock = (typeof winStart === "number") ? winStart : 0;
  if (typeof heldSince !== "undefined") heldSince = 0;
  if (!frameAlive) raf(frame);
});
window.addEventListener("deckpause", () => { paused = !paused; if (!paused) { last = null; if (!frameAlive) raf(frame); } });
function frame(ts) {
  if (last === null) last = ts;
  const dt = Math.min(0.05, (ts - last) / 1000); last = ts;
  if (!paused && !reduced) clock += dt; if (clock >= SETTLE_AT + 3) clock = 0;   // replay after a short hold: the slide stays alive
  draw(clock);
  window.__applet.settled = settled(clock);
  if (!paused) raf(frame);
}
window.__applet = { id: "reflexive-regimes", ready: false, settled: false };
resize(); draw(clock); window.__applet.ready = true; window.__applet.settled = settled(clock);
if (!paused && !reduced) raf(frame);
</script>
</body>
</html>
