<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07101e">
  <title>Finding Roots with Optical Twinning Trees — the talk</title>
  <meta name="description" content="A 15-slide visual talk by Denys I. Bondar, Gerard McCaul, and Eigen on feedback twinning as physical root finding.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root{color-scheme:dark;--bg:#050a12;--ink:#edf2f7;--muted:#8792a3;--gold:#e0b46e;--blue:#6fc9e8}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    .deck{display:grid;grid-template-rows:auto minmax(0,1fr) auto;width:100%;height:100%}
    .bar{display:flex;align-items:center;gap:.85rem;padding:max(.6rem,env(safe-area-inset-top)) 1rem .6rem;
      background:rgba(5,10,18,.92);border-bottom:1px solid rgba(255,255,255,.08);backdrop-filter:blur(14px)}
    .brand{min-width:0;flex:1}
    .brand b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.88rem}
    .brand span{display:block;color:var(--muted);font-size:.68rem;margin-top:.1rem}
    button,.download,.back{appearance:none;border:1px solid rgba(255,255,255,.12);border-radius:7px;background:#0e1726;
      color:var(--ink);padding:.52rem .7rem;text-decoration:none;font:600 .72rem/1 system-ui;cursor:pointer}
    button:hover,.download:hover,.back:hover{border-color:var(--blue)}
    .download{color:#06111d;background:var(--gold);border-color:var(--gold)}
    .back{color:var(--muted)}
    .stage{position:relative;min-height:0;display:grid;place-items:center;overflow:hidden;padding:1rem}
    .slide{display:block;max-width:100%;max-height:100%;width:auto;height:auto;aspect-ratio:16/9;
      object-fit:contain;background:#07101e;box-shadow:0 18px 60px rgba(0,0,0,.5)}
    .tap{position:absolute;top:0;bottom:0;width:22%;border:0;background:transparent;padding:0;outline:0}
    .tap:focus-visible{box-shadow:inset 0 0 0 1px rgba(111,201,232,.28)}
    .tap.prev{left:0;cursor:w-resize}.tap.next{right:0;cursor:e-resize}
    .controls{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:1rem;padding:.55rem 1rem
      max(.55rem,env(safe-area-inset-bottom));border-top:1px solid rgba(255,255,255,.08);background:#080e18}
    .counter{color:var(--muted);font:500 .7rem/1.4 ui-monospace,SFMono-Regular,Consolas,monospace}
    .progress{height:3px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden}
    .progress span{display:block;height:100%;width:6.666%;background:linear-gradient(90deg,var(--gold),var(--blue));
      transition:width .22s ease}
    .hint{color:#677386;font-size:.68rem;white-space:nowrap}
    .film{position:fixed;z-index:8;left:0;right:0;bottom:0;display:none;grid-template-columns:repeat(15,150px);
      gap:.55rem;padding:.8rem;overflow-x:auto;background:rgba(5,10,18,.96);border-top:1px solid rgba(255,255,255,.12)}
    .film.open{display:grid}
    .thumb{padding:0;border:1px solid rgba(255,255,255,.1);border-radius:4px;overflow:hidden;background:#07101e}
    .thumb.active{border-color:var(--gold)}
    .thumb img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
    @media(max-width:720px){
      .bar{gap:.45rem}.brand span,.hint,.back{display:none}.download{padding:.52rem}
      .stage{padding:.35rem}.controls{grid-template-columns:auto 1fr}
      .film{grid-template-columns:repeat(15,105px)}
    }
  </style>
</head>
<body>
  <main class="deck">
    <header class="bar">
      <a class="back" href="/demo/">← generation</a>
      <div class="brand"><b>Finding Roots with Optical Twinning Trees</b>
        <span>Denys I. Bondar · Gerard McCaul · with Eigen</span></div>
      <button id="overview" type="button">slides</button>
      <button id="fullscreen" type="button">full screen</button>
      <a class="download" href="/assets/docs/finding-roots-optical-twinning-trees-talk.pptx?v=20260724c" download>PPTX</a>
    </header>
    <section class="stage" aria-live="polite">
      <img class="slide" id="slide" src="slides/slide-1.png?v=20260724c"
        alt="Slide 1 of 15: Finding Roots with Optical Twinning Trees">
      <button class="tap prev" id="prev" aria-label="Previous slide"></button>
      <button class="tap next" id="next" aria-label="Next slide"></button>
    </section>
    <footer class="controls">
      <span class="counter" id="counter">01 / 15</span>
      <div class="progress" aria-hidden="true"><span id="progress"></span></div>
      <span class="hint">← → · space · swipe</span>
    </footer>
  </main>
  <nav class="film" id="film" aria-label="Slide overview"></nav>
  <script>
    const total = 15;
    const assetVersion = '20260724c';
    const labels = [
      'Title: Finding Roots with Optical Twinning Trees',
      'Different materials, one optical response',
      'The original proposal solves before it shines',
      'Let the materials find the field',
      'The loop stops where the responses match',
      'Latency turns a root into a stability problem',
      'One field twins two interacting Hubbard rings',
      'Kerr matching writes a quadratic into hardware',
      'The controller sign selects an attracting root',
      'A quadratic knows only two places to stop',
      'Multiply residuals, not explanations',
      'A single optical circuit reaches all four roots',
      'Every run ends at a root or a declared power limit',
      'A repeated root deletes one restoring direction',
      'Light can solve where materials agree'
    ];
    const slide = document.getElementById('slide');
    const counter = document.getElementById('counter');
    const progress = document.getElementById('progress');
    const film = document.getElementById('film');
    let current = Math.max(1, Math.min(total, Number(location.hash.slice(1)) || 1));
    let touchX = null;

    for (let i = 1; i <= total; i += 1) {
      const button = document.createElement('button');
      button.className = 'thumb';
      button.type = 'button';
      button.setAttribute('aria-label', 'Go to slide ' + i);
      button.innerHTML = '<img loading="lazy" src="slides/slide-' + i + '.png?v=' + assetVersion + '" alt="">';
      button.addEventListener('click', () => { show(i); film.classList.remove('open'); });
      film.appendChild(button);
    }
    const thumbs = Array.from(film.children);

    function show(index) {
      current = Math.max(1, Math.min(total, index));
      slide.src = 'slides/slide-' + current + '.png?v=' + assetVersion;
      slide.alt = 'Slide ' + current + ' of ' + total + ': ' + labels[current - 1];
      counter.textContent = String(current).padStart(2, '0') + ' / ' + total;
      progress.style.width = (current / total * 100) + '%';
      thumbs.forEach((thumb, i) => thumb.classList.toggle('active', i + 1 === current));
      history.replaceState(null, '', '#' + current);
      [current - 1, current + 1].forEach(i => {
        if (i < 1 || i > total) return;
        const preload = new Image();
        preload.src = 'slides/slide-' + i + '.png?v=' + assetVersion;
      });
    }
    function step(delta) { show(current + delta); }
    document.getElementById('prev').addEventListener('click', () => step(-1));
    document.getElementById('next').addEventListener('click', () => step(1));
    document.getElementById('overview').addEventListener('click', () => film.classList.toggle('open'));
    document.getElementById('fullscreen').addEventListener('click', async () => {
      if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
      else await document.exitFullscreen();
    });
    document.addEventListener('keydown', event => {
      if (['ArrowRight', 'PageDown', ' '].includes(event.key)) { event.preventDefault(); step(1); }
      if (['ArrowLeft', 'PageUp'].includes(event.key)) { event.preventDefault(); step(-1); }
      if (event.key === 'Home') show(1);
      if (event.key === 'End') show(total);
      if (event.key.toLowerCase() === 'o') film.classList.toggle('open');
      if (event.key === 'Escape') film.classList.remove('open');
    });
    document.addEventListener('touchstart', event => { touchX = event.changedTouches[0].clientX; }, {passive:true});
    document.addEventListener('touchend', event => {
      if (touchX === null) return;
      const delta = event.changedTouches[0].clientX - touchX;
      if (Math.abs(delta) > 45) step(delta < 0 ? 1 : -1);
      touchX = null;
    }, {passive:true});
    window.addEventListener('hashchange', () => show(Number(location.hash.slice(1)) || current));
    show(current);
  </script>
</body>
</html>
